<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080A">
  <meta name="description" content="Portfolio — designing digital products that stand out.">
  <meta name="robots" content="index, follow">
  <title>Portfolio</title>

  <!-- Preconnect to Google for faster first paint -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23A78BFA'/></svg>">

  <style>
    *,
    *::before,
    *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08080A;
      --text: #F4F4F5;
      --text-2: #A1A1AA;
      --accent: #A78BFA;
      --accent-soft: rgba(167,139,250,0.15);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif: 'Fraunces', 'Georgia', serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
    }

    /* ============================================================
       LOADER — TRANSPARENT OVERLAY
       No background. Cannot hide the site. Fades out on its own.
       ============================================================ */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: transparent;   /* ← no black background */
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.75rem;
      pointer-events: none;       /* ← never blocks clicks */
      transition: opacity 0.6s var(--ease-out), visibility 0.6s;
    }
    #loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-mark {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 500;
      font-style: italic;
      letter-spacing: -0.03em;
      color: var(--text);
      display: flex;
      gap: 0.02em;
      mix-blend-mode: difference;   /* keeps it legible on any bg */
    }
    .loader-mark span {
      display: inline-block;
      opacity: 0;
      transform: translateY(30px) rotate(6deg);
      animation: letterUp 0.9s var(--ease-out) forwards;
    }
    @keyframes letterUp {
      to { opacity: 1; transform: translateY(0) rotate(0); }
    }

    .loader-bar {
      width: 200px;
      height: 1px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      position: relative;
    }
    .loader-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: translateX(-100%);
      animation: barSlide 1.6s ease-in-out infinite;
    }
    @keyframes barSlide {
      0%   { transform: translateX(-100%); }
      50%  { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }

    .loader-status {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-2);
    }

    /* ============================================================
       IFRAME — visible immediately, no waiting for load event
       ============================================================ */
    #app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + 60px);   /* hides Apps Script attribution bar */
      border: 0;
      display: block;
      background: var(--bg);
      opacity: 1;                   /* ← always visible */
      transition: opacity 0.4s var(--ease-out);
      color-scheme: dark;
    }

    /* Fallback for users with JS disabled */
    .no-js {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      background: var(--bg);
      color: var(--text-2);
      font-size: 0.9rem;
      line-height: 1.6;
      z-index: 20;
    }
    .no-js a { color: var(--accent); text-decoration: underline; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .loader-mark span { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <!-- ================= IFRAME (renders from the very first paint) ================= -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbyWQDNAZD9J2OF5yHDxL3yavsob_PMGG5uBsXDB8cL1V54FxK6dUTSw8-bZI3ktVotYmg/exec"
    title="Portfolio"
    loading="eager"
    allow="clipboard-write; clipboard-read"
    referrerpolicy="no-referrer-when-downgrade"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals"
    aria-label="Portfolio application"
  ></iframe>

  <!-- ================= TRANSPARENT LOADER OVERLAY ================= -->
  <div id="loader" aria-hidden="true">
    <div class="loader-mark" id="loader-mark"></div>
    <div class="loader-bar"></div>
    <div class="loader-status">Loading portfolio</div>
  </div>

  <!-- ================= NO-JS FALLBACK ================= -->
  <noscript>
    <div class="no-js">
      <p>
        This site requires JavaScript.<br>
        <a href="https://script.google.com/macros/s/AKfycbyWQDNAZD9J2OF5yHDxL3yavsob_PMGG5uBsXDB8cL1V54FxK6dUTSw8-bZI3ktVotYmg/exec">
          Open the portfolio directly →
        </a>
      </p>
    </div>
  </noscript>

  <script>
    (function () {
      'use strict';

      var loader = document.getElementById('loader');
      var loaderMark = document.getElementById('loader-mark');
      var frame = document.getElementById('app-frame');

      // ---------- Animate loading mark ----------
      var brandText = 'Portfolio';
      loaderMark.innerHTML = '';
      brandText.split('').forEach(function (ch, i) {
        var span = document.createElement('span');
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        span.style.animationDelay = (i * 0.05) + 's';
        loaderMark.appendChild(span);
      });

      // ---------- Fade the loader out (iframe is already visible) ----------
      var hidden = false;
      function hideLoader() {
        if (hidden) return;
        hidden = true;
        loader.classList.add('done');
      }

      // Hide as soon as the iframe has painted something
      frame.addEventListener('load', function () {
        setTimeout(hideLoader, 500);
      });

      // Failsafe: hide after 3s no matter what
      setTimeout(hideLoader, 3000);

      // Extra failsafe: hide as soon as the user interacts
      ['click', 'touchstart', 'keydown', 'scroll', 'mousemove'].forEach(function (evt) {
        window.addEventListener(evt, hideLoader, { once: true, passive: true });
      });

      // ---------- Prevent double-tap zoom on iOS ----------
      var lastTouch = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouch <= 300) {
          e.preventDefault();
        }
        lastTouch = now;
      }, { passive: false });

      // ---------- Deep-link support ----------
      if (window.location.hash) {
        var tryForward = setInterval(function () {
          try {
            var doc = frame.contentDocument || frame.contentWindow.document;
            if (doc && doc.readyState === 'complete') {
              frame.contentWindow.postMessage({
                type: 'hash',
                value: window.location.hash
              }, '*');
              clearInterval(tryForward);
            }
          } catch (err) {
            clearInterval(tryForward);
          }
        }, 300);
        setTimeout(function () { clearInterval(tryForward); }, 8000);
      }
    })();
  </script>

</body>
</html>
